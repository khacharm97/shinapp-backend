version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shinapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: 
      context: .
      args:
        APP: auth
    environment:
      - DATABASE_URL=postgresql://root:password@postgres:5432/shinapp?schema=public
      - JWT_SECRET=super_secret_key
    depends_on:
      - postgres

  masters-service:
    build: 
      context: .
      args:
        APP: masters
    environment:
      - DATABASE_URL=postgresql://root:password@postgres:5432/shinapp?schema=public
    depends_on:
      - postgres

  admin-service:
    build: 
      context: .
      args:
        APP: admin
    environment:
      - DATABASE_URL=postgresql://root:password@postgres:5432/shinapp?schema=public
      - JWT_SECRET=super_secret_key
    depends_on:
      - postgres

  api-gateway:
    build: 
      context: .
      args:
        APP: api-gateway
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://root:password@postgres:5432/shinapp?schema=public
      - AUTH_HOST=auth-service
      - MASTERS_HOST=masters-service
      - ADMIN_HOST=admin-service
      - JWT_SECRET=super_secret_key
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-507203893182-la9lrf9mdka443bafkov7gvgvbaqhpag.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - auth-service
      - masters-service
      - admin-service
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
